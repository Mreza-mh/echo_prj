<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معماری سامانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #eef2f7;
    font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    padding: 40px 24px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 34px 38px 28px;
    max-width: 1180px;
    width: 100%;
    box-shadow: 0 1px 4px rgba(15, 23, 42, .07);
  }
  header { margin-bottom: 28px; }
  header h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
  header p  { font-size: 14px; color: #64748b; }
  svg { width: 100%; height: auto; display: block; }
  .gt { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.2px; }
  .n  { font-size: 14.5px; font-weight: 700; fill: #1a2434; text-anchor: middle; }
  .s  { font-size: 12px; fill: #6b7a90; text-anchor: middle; }
  svg text { font-family: inherit; }
  svg image { image-rendering: -webkit-optimize-contrast; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>معماری سامانه</h1>
    <p>نمای کلی اجزای اصلی و ارتباط میان آن‌ها</p>
  </header>

    <defs>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">

      <linearGradient id="g-ng"      x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8486d"/><stop offset="1" stop-color="#b50a31"/></linearGradient>
      <linearGradient id="g-kong"    x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b76f0"/><stop offset="1" stop-color="#1e46c0"/></linearGradient>
      <linearGradient id="g-laravel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a52"/><stop offset="1" stop-color="#e02412"/></linearGradient>
      <linearGradient id="g-fastapi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17b8a6"/><stop offset="1" stop-color="#0b8377"/></linearGradient>

      <linearGradient id="g-qdrant"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e94a6e"/><stop offset="1" stop-color="#b01640"/></linearGradient>

      <linearGradient id="g-mqtt"    x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6320c9"/></linearGradient>
