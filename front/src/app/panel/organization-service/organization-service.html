<div class="service-container mx-4 py-4">
  <div class="header">
    <h1>{{ getTranslation('organizationServices') }}</h1>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      {{ getTranslation('addService') }}
    </button>
  </div>

  <mat-card class="table-card">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('name') }}</th>
          <td mat-cell *matCellDef="let service">{{ service?.title }}</td>
        </ng-container>

        <!-- Price Column -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('price') }}</th>
          <td mat-cell *matCellDef="let service">{{ service.price | number }}</td>
        </ng-container>

        <!-- Duration Column -->
        <ng-container matColumnDef="duration">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('duration') }}</th>
          <!-- <td mat-cell *matCellDef="let service">{{ service.duration | date }}</td> -->
                     <td mat-cell *matCellDef="let service">{{ service.duration  }}</td>

        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('actions') }}</th>
          <td mat-cell *matCellDef="let service">
            <button mat-icon-button color="accent" (click)="goToAppointment(service)" [matTooltip]="getTranslation('appointments')">
              <mat-icon>event_available</mat-icon>
            </button>
            <button mat-icon-button color="primary" (click)="openEditDialog(service)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteService(service)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            {{ getTranslation('noServicesFound') }}
          </td>
        </tr>
      </table>
    </div>
  </mat-card>
</div>
