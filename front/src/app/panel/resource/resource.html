<div class="resource-container">
  <div class="header">
    <h1>{{ getTranslation('resources') }}</h1>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      {{ getTranslation('addResource') }}
    </button>
  </div>

  <mat-card class="table-card">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('name') }}</th>
          <td mat-cell *matCellDef="let resource">{{ resource.resource_name }}</td>
        </ng-container>

        <!-- Type Column -->
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('type') }}</th>
          <td mat-cell *matCellDef="let resource">{{ getTranslation(resource.resource_type) || resource.resource_type }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('actions') }}</th>
          <td mat-cell *matCellDef="let resource">
            <button mat-icon-button color="primary" (click)="openEditDialog(resource)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteResource(resource)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="3">
            {{ getTranslation('noResourcesFound') }}
          </td>
        </tr>
      </table>
    </div>
  </mat-card>
</div>
