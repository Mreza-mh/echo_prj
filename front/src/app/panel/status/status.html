<div class="status-container">
  <div class="header">
    <h1>{{ getTranslation('statuses') }}</h1>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      {{ getTranslation('addStatus') }}
    </button>
  </div>

  <mat-card class="table-card">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource">
        <!-- Title Column -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('title') }}</th>
          <td mat-cell *matCellDef="let status">{{ status.title }}</td>
        </ng-container>

        <!-- Label Column -->
        <ng-container matColumnDef="label">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('label') }}</th>
          <td mat-cell *matCellDef="let status">{{ status.label }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>{{ getTranslation('actions') }}</th>
          <td mat-cell *matCellDef="let status">
            <button mat-icon-button color="primary" (click)="openEditDialog(status)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteStatus(status)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="3">
            {{ getTranslation('noStatusFound') }}
          </td>
        </tr>
      </table>
    </div>
  </mat-card>
</div>
