<div class="image-viewer-dialog">
  <h2 mat-dialog-title>
    <mat-icon>image</mat-icon>
    Image Viewer
  </h2>
  <div mat-dialog-content class="dialog-content">
    <img [src]="data.imageUrl" alt="Echo Image" />
  </div>
  <div mat-dialog-actions class="jend"  >
    <button mat-raised-button (click)="onClose()">
      <mat-icon>close</mat-icon>
      Close
    </button>
  </div>
</div>

<style>
  .image-viewer-dialog {
    height: 100% !important;
    h2 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0;
      padding: 1rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-color);

      mat-icon {
        color: #dc3246;
      }
    }

    .dialog-content {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      min-height: 300px;

      overflow: auto;

      img {
        max-width: 100%;
        max-height: 75vh;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 4px 16px var(--shadow);
      }
    }

    [mat-dialog-actions] {
      bottom: 0 !important;
      padding: 1rem;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: end !important;
      margin-top: auto;

      button {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: linear-gradient(135deg, #dc3246 0%, #c82030 100%);
        color: white;

        &:hover {
          transform: translateY(-2px);
          box-shadow: 0 4px 12px rgba(220, 50, 70, 0.3);
        }
      }
    }
  }

  @media (max-width: 768px) {
    .image-viewer-dialog {
      .dialog-content {
        padding: 1rem;

        img {
          max-height: 60vh;
        }
      }
    }
  }
</style>
